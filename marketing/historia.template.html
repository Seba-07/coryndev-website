<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CORYN — historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Historia de 1080x1920. Instagram pone su interfaz encima: la barra de
     progreso y el perfil arriba, y el campo de responder abajo. Por eso el
     contenido vive entre los 250px y los 1660px: fuera de ahi queda tapado. */
  :root{ --tinta:#0a1730; --gris:#5b6d8d; --papel:#ffffff;
         --linea:#e4ebf5; --azul:#1f5fe0; --suave:#eef3fb; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--tinta);
        background:var(--papel); -webkit-font-smoothing:antialiased; }
  h1,h2{ font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-.025em; line-height:1.05; }

  .historia{ width:1080px; height:1920px; position:relative; overflow:hidden;
             background:var(--papel); display:flex; flex-direction:column; }
  /* El contenido se centra verticalmente: las laminas de puro texto llenaban
     solo la mitad de arriba y dejaban un vacio que se leia como error. El pie
     va anclado abajo, con holgura extra sobre la barra de responder. */
  .segura{ position:absolute; left:0; right:0; top:250px; bottom:285px;
           padding:0 72px 120px; display:flex; flex-direction:column;
           justify-content:center; z-index:2; }

  .marca{ position:absolute; left:72px; top:150px; z-index:3;
          display:flex; align-items:center; gap:14px; }
  .marca img{ width:44px; }
  .marca b{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
            font-size:28px; letter-spacing:.15em; }

  .rot{ font-size:26px; letter-spacing:.18em; text-transform:uppercase;
        color:var(--azul); font-weight:600; margin-bottom:26px; }
  h1{ font-size:96px; font-weight:800; }
  h2{ font-size:62px; font-weight:800; }
  h1 em, h2 em{ font-style:normal; color:var(--azul); }
  .texto{ margin-top:32px; font-size:38px; line-height:1.42; color:var(--gris); }
  .texto b{ color:var(--tinta); font-weight:600; }

  .imagen{ margin:0 -72px 44px; height:620px; overflow:hidden; background:#0a1730; }
  .imagen img{ width:100%; height:100%; object-fit:cover; object-position:top center; }

  /* Capturas verticales: recortadas a una franja apaisada se leen como pantalla
     de escritorio. Van dentro de un marco con forma de telefono, sin recortar. */
  .imagen.telefono{ margin:0 0 44px; height:700px; background:none;
                    display:flex; align-items:center; justify-content:center; }
  .imagen.telefono img{ width:auto; height:100%; object-fit:contain;
                        border-radius:38px; border:9px solid var(--tinta);
                        box-shadow:0 24px 60px rgba(10,23,48,.18); }

  /* tabla de precios */
  .tabla{ width:100%; border-collapse:collapse; margin-top:14px; }
  .tabla td{ padding:30px 0; border-top:2px solid var(--linea); font-size:40px; }
  .tabla td.n{ text-align:right; font-family:'IBM Plex Mono',monospace;
               font-weight:600; color:var(--azul); white-space:nowrap; }
  .tabla tr:last-child td{ border-bottom:2px solid var(--linea); }

  .lista{ margin-top:34px; display:grid; gap:24px; }
  .lista div{ display:grid; grid-template-columns:44px 1fr; gap:20px;
              align-items:baseline; font-size:36px; line-height:1.35; }
  .lista i{ font-style:normal; color:var(--azul); font-size:34px; }

  .caja{ margin-top:56px; background:var(--suave); border-radius:26px;
         padding:40px 46px; font-size:34px; line-height:1.4; color:var(--gris); }
  .caja b{ color:var(--tinta); font-weight:600; }

  .pie{ position:absolute; left:72px; right:72px; bottom:0;
        display:flex; align-items:center; justify-content:space-between;
        border-top:2px solid var(--linea); padding-top:30px;
        font-family:'IBM Plex Mono',monospace; font-size:30px; color:var(--gris); }
  .pie b{ color:var(--azul); }
</style>
</head>
<body>
<section class="historia">
  <div class="marca"><img src="{{MARK}}" alt=""><b>CORYN</b></div>
  <div class="segura">
{{CONTENIDO}}
    <div class="pie"><span>coryndev.com</span><b>{{PIE}}</b></div>
  </div>
</section>
</body>
</html>
