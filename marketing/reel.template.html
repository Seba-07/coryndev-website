<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CORYN — fotograma de reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Fotograma de reel, 1080x1920. La interfaz de reels tapa mas que la de
     historias: los botones de la derecha (~200px) y el pie con el texto y el
     audio (~380px). Por eso el contenido vive en una caja mas angosta y mas
     alta que en las historias, y va centrado. */
  :root{ --tinta:#0a1730; --gris:#5b6d8d; --papel:#ffffff; --azul:#1f5fe0;
         --linea:#e4ebf5; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--tinta);
        background:var(--papel); -webkit-font-smoothing:antialiased; }

  .cuadro{ width:1080px; height:1920px; position:relative; overflow:hidden;
           background:var(--papel); }
  .segura{ position:absolute; left:80px; right:230px; top:260px; bottom:400px;
           display:flex; flex-direction:column; justify-content:center; }

  .marca{ position:absolute; left:80px; top:150px; display:flex;
          align-items:center; gap:14px; }
  .marca img{ width:44px; }
  .marca b{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
            font-size:28px; letter-spacing:.15em; }

  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
      font-size:118px; line-height:1.02; letter-spacing:-.03em; }
  h1 em{ font-style:normal; color:var(--azul); }
  .sub{ margin-top:38px; font-size:44px; line-height:1.35; color:var(--gris); }
  .sub b{ color:var(--tinta); font-weight:600; }

  /* fotograma de precio: el numero manda */
  .que{ font-size:46px; font-weight:600; color:var(--gris); }
  .monto{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
          font-size:150px; letter-spacing:-.04em; color:var(--azul);
          line-height:1; margin-top:18px; }
  .mas{ margin-top:26px; font-family:'IBM Plex Mono',monospace;
        font-size:42px; color:var(--tinta); }
  .nota{ margin-top:44px; padding-top:30px; border-top:3px solid var(--linea);
         font-size:34px; color:var(--gris); }
</style>
</head>
<body>
<section class="cuadro">
  <div class="marca"><img src="{{MARK}}" alt=""><b>CORYN</b></div>
  <div class="segura">
{{CONTENIDO}}
  </div>
</section>
</body>
</html>
