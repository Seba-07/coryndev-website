<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CORYN — portada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Portada de la ficha de Google: 1440x810 (16:9). Google la recorta distinto
     segun el dispositivo, asi que todo el contenido vive en una zona segura
     centrada y no se apoya en los bordes. */
  :root{ --papel:#eef3fb; --tinta:#0a1730; --azul:#1f5fe0; --gris:#5b6d8d; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'IBM Plex Sans',system-ui,sans-serif; }
  .portada{
    width:1440px; height:810px; position:relative; overflow:hidden;
    /* Claro, a juego con el feed y con las piezas nuevas. Sin adornos
       tecnologicos: los cubos, circuitos y puntos son el cliche que delata
       una plantilla generada. */
    background:
      radial-gradient(80% 100% at 12% 0%, #ffffff 0%, rgba(255,255,255,0) 64%),
      var(--papel);
    display:flex; align-items:center; justify-content:center;
  }
  /* margen amplio: lo que quede fuera de aqui puede desaparecer al recortar */
  .segura{ width:1120px; text-align:center; color:var(--tinta); }
  .marca{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:52px; }
  .marca img{ width:74px; }
  .marca b{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
            font-size:46px; letter-spacing:.17em; }
  .ante{ font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:.22em;
         text-transform:uppercase; color:var(--azul); margin-bottom:26px; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
      font-size:86px; line-height:1.08; letter-spacing:-.025em; }
  h1 em{ font-style:normal; color:var(--azul); }
  .pie{ margin-top:46px; font-family:'IBM Plex Mono',monospace; font-size:26px;
        color:var(--gris); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="portada">
    <div class="segura">
      <div class="marca"><img src="{{MARK}}" alt=""><b>CORYN</b></div>
      <p class="ante">Para pymes chilenas</p>
      <h1>Software a la medida<br>de <em>cómo trabajas</em></h1>
      <p class="pie">coryndev.com &nbsp;·&nbsp; Primera reunión sin costo</p>
    </div>
  </div>
</body>
</html>
