<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CORYN — lámina para Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Lamina de 1080x1350 (4:5), en claro.
     Antes era oscura y de puro texto, y se leia como plantilla generica: fondo
     degradado, tipografia enorme y acento cian es la estetica que se reconoce
     al toque. Ahora manda la fotografia real, el fondo es papel y el texto va
     abajo sobre blanco. Todas las laminas llevan imagen. */
  :root{
    --tinta:#0a1730; --gris:#5b6d8d;
    --papel:#ffffff; --linea:#e4ebf5; --azul:#1f5fe0;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    color:var(--tinta); background:var(--papel);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-.025em; line-height:1.06; }

  .lamina{
    width:1080px; height:1350px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; background:var(--papel);
  }

  /* --- la foto manda: ocupa la mitad de arriba --- */
  .foto{ position:relative; height:660px; flex:none; overflow:hidden; background:#0a1730; }
  .foto img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* etiqueta sobre la foto, como el "Hoy / Con un sistema" del sitio */
  .sello{
    position:absolute; left:52px; top:48px; z-index:3;
    display:inline-flex; align-items:center; gap:14px;
    background:rgba(255,255,255,.94); border-radius:99px; padding:14px 28px;
    font-size:25px; font-weight:600;
  }
  .sello i{ font-style:normal; width:16px; height:16px; border-radius:50%;
            background:#8ea3c4; display:block; }
  .sello.bien i{ background:#20c25c; }
  .sello.abajo{ top:auto; bottom:44px; }

  .marca{
    position:absolute; right:48px; top:44px; z-index:3;
    display:flex; align-items:center; gap:13px;
    background:rgba(10,23,48,.85); border-radius:99px; padding:12px 24px 12px 17px;
  }
  .marca img{ width:36px; }
  .marca b{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
            font-size:24px; letter-spacing:.15em; color:#fff; }

  /* --- el texto, abajo, sobre papel --- */
  .cuerpo{ flex:1; padding:50px 64px 0; display:flex; flex-direction:column; }
  .rot{
    font-size:24px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--azul); font-weight:600; margin-bottom:20px;
  }
  h1{ font-size:74px; font-weight:800; }
  h1 em{ font-style:normal; color:var(--azul); }
  h2{ font-size:58px; font-weight:800; }
  h2 em{ font-style:normal; color:var(--azul); }
  .texto{ margin-top:26px; font-size:34px; line-height:1.4; color:var(--gris); }
  .texto b{ color:var(--tinta); font-weight:600; }

  .pie{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid var(--linea); padding:28px 0 38px;
    font-family:'IBM Plex Mono',monospace; font-size:25px; color:var(--gris);
  }
  .pie .desliza{ color:var(--azul); font-weight:600; }

  /* --- cierre: las dos capturas de clientes reales --- */
  .obras{ display:grid; grid-template-rows:1fr 1fr; gap:16px; height:100%; }
  .obra{ position:relative; overflow:hidden; background:#0a1730; }
  .obra img{ width:100%; height:100%; object-fit:cover; object-position:top center; }
  .obra span{
    position:absolute; left:20px; bottom:20px;
    background:rgba(255,255,255,.95); border-radius:99px; padding:9px 20px;
    font-size:23px; font-weight:600;
  }
</style>
</head>
<body>

<section class="lamina">
  {{FOTO}}
  <div class="cuerpo">
    {{CONTENIDO}}
    <div class="pie">
      <span>{{PIE_IZQ}}</span>
      <span class="desliza">{{PIE_DER}}</span>
    </div>
  </div>
</section>

</body>
</html>
