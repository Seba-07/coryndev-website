<!-- Fuente de la tarjeta de vista previa (Open Graph).
     Para regenerarla:
       chrome --headless --window-size=1200,630 --screenshot=assets/og.jpg site/og-card.html
     o mas simple: abrela en el navegador y captura a 1200x630. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{width:1200px;height:630px;overflow:hidden;position:relative;
   background:#0a1730 url("../assets/mark.webp") right center/cover no-repeat;
   font-family:'IBM Plex Sans',sans-serif;color:#fff}
 .velo{position:absolute;inset:0;background:
   radial-gradient(55% 80% at 76% 46%, rgba(35,150,190,.30) 0%, rgba(35,150,190,0) 64%),
   linear-gradient(100deg, rgba(7,14,32,.95) 0%, rgba(7,14,32,.7) 44%, rgba(7,14,32,.1) 100%)}
 .cont{position:relative;padding:66px 72px;height:100%;display:flex;flex-direction:column}
 .marca{display:flex;align-items:center;gap:14px}
 .marca img{width:52px}
 .marca span{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:34px;letter-spacing:.2em}
 .ceja{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;letter-spacing:.17em;
   text-transform:uppercase;color:#6fd8ec;margin-top:auto}
 h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:64px;line-height:1.05;
   letter-spacing:-.03em;margin-top:18px;max-width:17ch}
 h1 em{font-style:normal;background:linear-gradient(96deg,#6fd8ec,#74a6ff);
   -webkit-background-clip:text;color:transparent}
 .pie{margin-top:26px;display:flex;gap:26px;font-family:'IBM Plex Mono',monospace;
   font-size:19px;color:#9fbaea}
 .pie b{color:#dbe7fb;font-weight:600}
</style></head><body>
<div class="velo"></div>
<div class="cont">
  <div class="marca"><img src="../assets/mark.webp" alt=""><span>CORYN</span></div>
  <p class="ceja">Desarrollo de software a medida · Chile</p>
  <h1>El software se adapta a tu negocio, <em>no al revés</em></h1>
  <div class="pie"><b>coryndev.com</b><span>Salud · Inmobiliario · Retail</span></div>
</div>
</body></html>
